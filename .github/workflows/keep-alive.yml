name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -sS --max-time 30 https://randomify-nc4a.onrender.com/health || true
