services:
  postgres:
    image: postgres:16-alpine
    container_name: randomify-postgres
    restart: always
    environment:
      POSTGRES_USER: randomify
      POSTGRES_PASSWORD: randomify_password
      POSTGRES_DB: randomify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
